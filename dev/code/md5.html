<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD5 加密工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/spark-md5@3.0.2/spark-md5.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-hover {
                @apply transition-all duration-300 hover:shadow-xl;
            }
            .text-gradient {
                @apply bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-400;
            }
            .btn {
                @apply px-4 py-2 rounded-lg transition-all duration-200;
            }
            .btn-primary {
                @apply bg-primary text-white hover:bg-primary/80;
            }
            .btn-danger {
                @apply bg-red-500 text-white hover:bg-red-500/80;
            }
            .btn-success {
                @apply bg-emerald-500 text-white hover:bg-emerald-500/80;
            }
            .btn-purple {
                @apply bg-purple-500 text-white hover:bg-purple-500/80;
            }
            .btn-gray {
                @apply bg-gray-600 text-white hover:bg-gray-600/80;
            }
            .btn-outline {
                @apply border border-[var(--border)] hover:bg-[var(--card-sub)];
            }
        }

        html[data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e293b;
            --card-sub: #334155;
            --border: #475569;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --card-glow: rgba(59,130,246,0.08);
        }
        html[data-theme="light"] {
            --bg: #f8fafc;
            --card: #ffffff;
            --card-sub: #e2e8f0;
            --border: #cbd5e1;
            --text-main: #111827;
            --text-sub: #64748b;
            --card-glow: rgba(59,130,246,0.06);
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            transition: background-color 0.35s ease, color 0.35s ease;
            min-height: 100vh;
        }
        body::before{
            content:"";
            position:fixed;
            inset:0;
            z-index:-1;
            opacity:0.45;
            pointer-events:none;
            transition:background-image 0.35s ease;
        }
        html[data-theme="dark"] body::before{
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size:24px 24px;
        }
        html[data-theme="light"] body::before{
            background-image: linear-gradient(rgba(59,130,246,0.04) 1px,transparent 1px),
            linear-gradient(90deg,rgba(59,130,246,0.04) 1px,transparent 1px);
            background-size:28px 28px;
        }

        .nav-bar-bg {
            background-color: var(--card);
            border-color: var(--border);
            transition: background-color 0.35s ease, border-color 0.35s ease;
        }
        .tool-card{
            background-color: var(--card);
            border:1px solid var(--border);
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        .tool-card:hover{
            box-shadow: 0 8px 24px rgba(0,0,0,0.12), 0 0 14px var(--card-glow);
        }
        .sub-panel-bg {
            background-color: var(--card-sub);
        }
        .text-sub-color {
            color: var(--text-sub);
        }
        textarea,input,select{
            background-color: var(--card);
            border:1px solid var(--border);
            color:var(--text-main);
            font-family: Consolas,Menlo,monospace;
        }
        textarea:focus,input:focus,select:focus{
            outline:none;
            border-color:#3b82f6;
        }
        .copy-btn-inline{
            cursor:pointer;
            opacity:0.65;
            margin-left:8px;
        }
        .copy-btn-inline:hover{
            opacity:1;
        }
    </style>
</head>
<body class="flex flex-col">
    <header class="nav-bar-bg sticky top-0 z-10 border-b">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/toolkit/index.html" class="btn btn-outline flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i>
                <span>返回首页</span>
            </a>
            <h1 class="text-xl font-bold text-gradient">MD5 加密工具</h1>
            <button id="themeToggle" class="btn btn-outline" title="切换深浅主题">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-6xl flex-grow">
        <div class="tool-card p-6 rounded-xl">
            <div class="flex flex-wrap gap-2 mb-5">
                <button class="btn btn-primary" id="btnCalc"><i class="fa-solid fa-calculator mr-1"></i>计算MD5</button>
                <button class="btn btn-danger" id="btnClear"><i class="fa-solid fa-eraser mr-1"></i>清空</button>
            </div>

            <div class="flex flex-col gap-3 mb-5">
                <label class="text-sub-color">📥 输入原始文本</label>
                <textarea id="inputText" rows="6" placeholder="在这里输入需要计算MD5的文本"></textarea>
            </div>

            <div>
                <label class="block mb-2 text-sub-color">转换结果（点击📋复制该行）</label>
                <div id="detailPanel" class="sub-panel-bg p-4 rounded-xl text-sm space-y-2">
                    <div>MD5 32位小写：<span id="md5-32low">-</span>
                        <i class="fa-solid fa-copy copy-btn-inline" data-val="" title="复制"></i>
                    </div>
                    <div>MD5 32位大写：<span id="md5-32up">-</span>
                        <i class="fa-solid fa-copy copy-btn-inline" data-val="" title="复制"></i>
                    </div>
                    <div>MD5 16位小写：<span id="md5-16low">-</span>
                        <i class="fa-solid fa-copy copy-btn-inline" data-val="" title="复制"></i>
                    </div>
                    <div>MD5 16位大写：<span id="md5-16up">-</span>
                        <i class="fa-solid fa-copy copy-btn-inline" data-val="" title="复制"></i>
                    </div>
                </div>
            </div>

            <!-- 提示信息 -->
            <div class="mt-4">
                <label class="block mb-1 text-sub-color">状态信息</label>
                <div id="msgBox" class="p-3 rounded-lg sub-panel-bg min-h-[50px] text-sub-color"></div>
            </div>
        </div>
    </main>

    <footer class="nav-bar-bg border-t py-6 mt-10">
        <div class="container mx-auto px-4 text-center text-sub-color text-sm">
            <p>悟已往之不谏，知来者之可追</p>
            <p class="mt-1">© 2026 工具集 | 静态本地网页，不上传用户数据</p>
        </div>
    </footer>

    <script>
        // ==========主题==========
        function initTheme() {
            const saveTheme = localStorage.getItem("toolTheme") || "dark";
            document.documentElement.setAttribute("data-theme", saveTheme);
            updateThemeIcon(saveTheme);
        }
        function updateThemeIcon(theme) {
            const icon = document.getElementById("themeIcon");
            icon.className = theme === "dark" ? "fa-solid fa-moon" : "fa-solid fa-sun";
        }
        function bindThemeToggle() {
            const btn = document.getElementById("themeToggle");
            btn.addEventListener("click", ()=>{
                const current = document.documentElement.getAttribute("data-theme");
                const next = current === "dark" ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", next);
                localStorage.setItem("toolTheme", next);
                updateThemeIcon(next);
            })
        }

        const inputDom = document.getElementById('inputText');
        const msgBox = document.getElementById('msgBox');
        const el32low = document.getElementById('md5-32low');
        const el32up = document.getElementById('md5-32up');
        const el16low = document.getElementById('md5-16low');
        const el16up = document.getElementById('md5-16up');
        const copyBtns = document.querySelectorAll(".copy-btn-inline");

        let val32low = "";
        let val32up = "";
        let val16low = "";
        let val16up = "";

        function setMsg(text, isError = false) {
            msgBox.innerText = text;
            msgBox.style.color = isError ? '#f87171' : 'var(--text-sub)';
        }

        function resetDetail(){
            el32low.innerText = "-";
            el32up.innerText = "-";
            el16low.innerText = "-";
            el16up.innerText = "-";
            val32low = "";
            val32up = "";
            val16low = "";
            val16up = "";
            syncCopyBtnData();
        }

        function syncCopyBtnData(){
            const arr = [val32low, val32up, val16low, val16up];
            copyBtns.forEach((btn,idx)=>{
                btn.setAttribute("data-val", arr[idx] || "");
            })
        }

        copyBtns.forEach(btn=>{
            btn.onclick = async function(){
                const val = this.getAttribute("data-val");
                if(!val){
                    setMsg("暂无内容可复制",true);
                    return;
                }
                try{
                    await navigator.clipboard.writeText(val);
                    setMsg(`✅ 已复制：${val}`);
                }catch(e){
                    setMsg("❌ 复制失败，请手动复制",true);
                }
            }
        })

        function calcMd5(){
            resetDetail();
            const raw = inputDom.value;
            if(raw === ""){
                setMsg("请输入文本",true);
                return;
            }
            const hash32low = SparkMD5.hash(raw);
            const hash32up = hash32low.toUpperCase();
            const hash16low = hash32low.substring(8,24);
            const hash16up = hash16low.toUpperCase();

            el32low.innerText = hash32low;
            el32up.innerText = hash32up;
            el16low.innerText = hash16low;
            el16up.innerText = hash16up;

            val32low = hash32low;
            val32up = hash32up;
            val16low = hash16low;
            val16up = hash16up;
            syncCopyBtnData();
            setMsg("✅ MD5计算完成");
        }

        function clearAll(){
            inputDom.value = "";
            resetDetail();
            setMsg("");
        }

        function bindEvents(){
            document.getElementById('btnCalc').onclick = calcMd5;
            document.getElementById('btnClear').onclick = clearAll;
        }

        initTheme();
        bindThemeToggle();
        bindEvents();
    </script>
</body>
</html>
