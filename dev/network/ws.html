<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket调试面板 V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-hover {
                @apply transition-all duration-300 hover:shadow-xl;
            }
            .text-gradient {
                @apply bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-400;
            }
            .btn {
                @apply px-4 py-2 rounded-lg transition-all duration-200;
            }
            .btn-primary {
                @apply bg-primary text-white hover:bg-primary/80;
            }
            .btn-danger {
                @apply bg-red-500 text-white hover:bg-red-500/80;
            }
            .btn-success {
                @apply bg-emerald-500 text-white hover:bg-emerald-500/80;
            }
            .btn-purple {
                @apply bg-purple-500 text-white hover:bg-purple-500/80;
            }
            .btn-gray {
                @apply bg-gray-600 text-white hover:bg-gray-600/80;
            }
            .btn-outline {
                @apply border border-[var(--border)] hover:bg-[var(--card-sub)];
            }
        }

        html[data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e293b;
            --card-sub: #334155;
            --border: #475569;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --card-glow: rgba(59,130,246,0.08);
        }
        html[data-theme="light"] {
            --bg: #f8fafc;
            --card: #ffffff;
            --card-sub: #e2e8f0;
            --border: #cbd5e1;
            --text-main: #111827;
            --text-sub: #64748b;
            --card-glow: rgba(59,130,246,0.06);
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            transition: background-color 0.35s ease, color 0.35s ease;
            min-height: 100vh;
        }
        body::before{
            content:"";
            position:fixed;
            inset:0;
            z-index:-1;
            opacity:0.45;
            pointer-events:none;
            transition:background-image 0.35s ease;
        }
        html[data-theme="dark"] body::before{
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size:24px 24px;
        }
        html[data-theme="light"] body::before{
            background-image: linear-gradient(rgba(59,130,246,0.04) 1px,transparent 1px),
            linear-gradient(90deg,rgba(59,130,246,0.04) 1px,transparent 1px);
            background-size:28px 28px;
        }

        .nav-bar-bg {
            background-color: var(--card);
            border-color: var(--border);
            transition: background-color 0.35s ease, border-color 0.35s ease;
        }
        .tool-card{
            background-color: var(--card);
            border:1px solid var(--border);
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        .tool-card:hover{
            box-shadow: 0 8px 24px rgba(0,0,0,0.12), 0 0 14px var(--card-glow);
        }
        .sub-panel-bg {
            background-color: var(--card-sub);
        }
        .text-sub-color {
            color: var(--text-sub);
        }
        input,select,textarea{
            background-color: var(--card);
            border:1px solid var(--border);
            color:var(--text-main);
        }
        input:focus,select:focus,textarea:focus{
            outline:none;
            border-color:#3b82f6;
        }

        /* 日志面板 */
        #msgLog{
            background:#1e1e1e;
            color:#fff;
            font-family:Consolas,monospace;
            font-size:13px;
            border-radius:0.5rem;
            padding:12px;
            height:340px;
            overflow-y:auto;
            white-space:pre-wrap;
            border:1px solid var(--border);
        }
        .log-send {color:#9cdcfe;}
        .log-recv {color:#ce9178;}
        .log-info {color:#4ec9b0;}
        .log-error {color:#f48771;}
    </style>
</head>
<body class="flex flex-col">
    <!-- 顶部栏：返回首页 + 标题 + 主题切换 -->
    <header class="nav-bar-bg sticky top-0 z-10 border-b">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/toolkit/index.html" class="btn btn-outline flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i>
                <span>返回首页</span>
            </a>
            <h1 class="text-xl font-bold text-gradient">WebSocket调试面板 V2</h1>
            <button id="themeToggle" class="btn btn-outline" title="切换深浅主题">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl flex-grow">
        <div class="tool-card p-6 rounded-xl">
            <div class="space-y-5">
                <!-- WS地址 -->
                <div class="flex flex-wrap items-center gap-3">
                    <label class="text-sub-color w-24 shrink-0">WS地址：</label>
                    <input id="wsUrl" class="flex-1 min-w-[300px]" value="ws://127.0.0.1:8080/ws/endpoint" placeholder="ws://xxx/ws/{userId}">
                </div>
                <!-- Token -->
                <div class="flex flex-wrap items-center gap-3">
                    <label class="text-sub-color w-24 shrink-0">Token：</label>
                    <input id="tokenInput" class="flex-1 min-w-[300px]" placeholder="填入token，留空则不带token参数">
                    <span class="sub-panel-bg px-3 py-1 rounded text-sub-color">状态：<span id="connectStatus">未连接</span></span>
                </div>
                <!-- 操作按钮 -->
                <div class="flex flex-wrap gap-2">
                    <button class="btn btn-primary" id="btnConnect"><i class="fa-solid fa-plug mr-1"></i>建立连接</button>
                    <button class="btn btn-danger" id="btnClose"><i class="fa-solid fa-xmark mr-1"></i>关闭连接</button>
                    <button class="btn btn-gray" id="btnClearLog"><i class="fa-solid fa-eraser mr-1"></i>清空日志</button>
                </div>

                <!-- 接收日志 -->
                <div class="flex flex-col gap-2">
                    <label class="text-sub-color">📥 接收消息日志：</label>
                    <div id="msgLog"></div>
                </div>

                <!-- 发送区域 -->
                <div class="flex flex-col gap-2">
                    <div class="flex flex-wrap items-center gap-3">
                        <label class="text-sub-color shrink-0">📤 发送JSON模板：</label>
                        <select id="templateSelect" class="w-44">
                            <option value="position">数据发送</option>
                            <option value="custom">自定义</option>
                        </select>
                        <button class="btn btn-purple" id="btnFormat"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>格式化JSON</button>
                        <button class="btn btn-success" id="btnSend"><i class="fa-solid fa-paper-plane mr-1"></i>发送消息</button>
                    </div>
                    <textarea id="sendJson" rows="10"></textarea>
                </div>
            </div>
        </div>
    </main>

    <footer class="nav-bar-bg border-t py-6 mt-10">
        <div class="container mx-auto px-4 text-center text-sub-color text-sm">
            <p>悟已往之不谏，知来者之可追</p>
            <p class="mt-1">© 2026 工具集 | 静态本地网页，不上传用户数据</p>
        </div>
    </footer>

    <script>
        // ========== 主题逻辑，和首页互通localStorage ==========
        function initTheme() {
            const saveTheme = localStorage.getItem("toolTheme") || "dark";
            document.documentElement.setAttribute("data-theme", saveTheme);
            updateThemeIcon(saveTheme);
        }
        function updateThemeIcon(theme) {
            const icon = document.getElementById("themeIcon");
            icon.className = theme === "dark" ? "fa-solid fa-moon" : "fa-solid fa-sun";
        }
        function bindThemeToggle() {
            const btn = document.getElementById("themeToggle");
            btn.addEventListener("click", ()=>{
                const current = document.documentElement.getAttribute("data-theme");
                const next = current === "dark" ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", next);
                localStorage.setItem("toolTheme", next);
                updateThemeIcon(next);
            })
        }

        // ========== WebSocket业务逻辑【原样保留】 ==========
        let ws = null;
        const $ = selector => document.querySelector(selector);
        const msgLogDom = $("#msgLog");
        const statusDom = $("#connectStatus");
        const jsonTextarea = $("#sendJson");
        const tokenInput = $("#tokenInput");

        const templateMap = {
            position: `{
  "type": 8,
  "batchId": "",
  "fromId": "",
  "toId": "",
  "data": {
    "lon": 113.9321,
    "lat": 28.1234
  }
}`,
            custom: `{}`
        };

        $("#templateSelect").onchange = function () {
            jsonTextarea.value = templateMap[this.value];
        };
        jsonTextarea.value = templateMap.position;

        function log(text, type = 'info') {
            const time = new Date().toLocaleTimeString();
            let className = "";
            if(type === 'send') className = "log-send";
            if(type === 'recv') className = "log-recv";
            if(type === 'error') className = "log-error";
            const line = `<div class="${className}">[${time}] ${text}</div>`;
            msgLogDom.innerHTML += line;
            msgLogDom.scrollTop = msgLogDom.scrollHeight;
        }

        function formatJson() {
            const raw = jsonTextarea.value.trim();
            if(!raw) return;
            try {
                const obj = JSON.parse(raw);
                jsonTextarea.value = JSON.stringify(obj, null, 2);
                log("✅ JSON格式化成功");
            } catch(e) {
                log(`❌ JSON格式错误：${e.message}`, "error");
            }
        }

        $("#btnClearLog").onclick = () => {
            msgLogDom.innerHTML = "";
            log("✅ 日志已清空");
        };

        $("#btnConnect").onclick = () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                log("⚠️ 已经处于连接状态");
                return;
            }
            let url = $("#wsUrl").value.trim();
            const token = tokenInput.value.trim();
            if(token){
                const sep = url.includes('?') ? '&' : '?';
                url = url + sep + "token=" + encodeURIComponent(token);
            }
            log(`🔗 最终连接地址: ${url}`);
            ws = new WebSocket(url);
            statusDom.textContent = "连接中...";
            ws.onopen = () => {
                statusDom.textContent = "✅ 已连接";
                log("✅ WebSocket 连接成功");
            };
            ws.onmessage = (event) => {
                try {
                    const jsonObj = JSON.parse(event.data);
                    const pretty = JSON.stringify(jsonObj, null, 2);
                    log(`📥 收到消息：\n${pretty}`, "recv");
                } catch(e) {
                    log(`📥 收到消息：${event.data}`, "recv");
                }
            };
            ws.onclose = (evt) => {
                statusDom.textContent = "❌ 未连接";
                log(`🔌 连接关闭 code:${evt.code}, reason:${evt.reason}`);
                ws = null;
            };
            ws.onerror = (err) => {
                statusDom.textContent = "❌ 异常";
                log(`❌ WS异常`, "error");
            };
        };

        $("#btnClose").onclick = () => {
            if (!ws) {
                log("⚠️ 暂无连接");
                return;
            }
            ws.close();
        };

        $("#btnFormat").onclick = formatJson;

        $("#btnSend").onclick = () => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log("⚠️ 连接未打开，无法发送", "error");
                return;
            }
            const jsonStr = jsonTextarea.value.trim();
            try {
                JSON.parse(jsonStr);
            } catch (e) {
                log("❌ JSON格式错误，发送取消", "error");
                return;
            }
            ws.send(jsonStr);
            log(`📤 发送消息：\n${jsonStr}`, "send");
        };

        // 初始化
        initTheme();
        bindThemeToggle();
    </script>
</body>
</html>
