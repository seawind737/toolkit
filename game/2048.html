<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 数字合体</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    colors: { primary: '#3b82f6' },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            background-image: linear-gradient(to right, #60a5fa, #22d3ee);
        }
        .btn {
            padding: 0.5rem 0.85rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: rgba(59, 130, 246, 0.8); }
        .btn-outline { border: 1px solid var(--border); }
        .btn-outline:hover { background-color: var(--card-sub); }

        html[data-theme="dark"] {
            --bg: #0f172a; --card: #1e293b; --card-sub: #334155; --border: #475569;
            --text-main: #e2e8f0; --text-sub: #94a3b8;
            --grid-bg: #0f172a; --cell-empty: #1e293b;
        }
        html[data-theme="light"] {
            --bg: #f8fafc; --card: #ffffff; --card-sub: #e2e8f0; --border: #cbd5e1;
            --text-main: #111827; --text-sub: #64748b;
            --grid-bg: #cbd5e1; --cell-empty: #e2e8f0;
        }
        body {
            background-color: var(--bg); color: var(--text-main);
            transition: background-color 0.35s ease, color 0.35s ease; min-height: 100vh;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1; opacity: 0.45; pointer-events: none;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .nav-bar-bg { background-color: var(--card); border-color: var(--border); transition: 0.35s; }
        .tool-card { background-color: var(--card); border: 1px solid var(--border); box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .text-sub-color { color: var(--text-sub); }

        /* 2048 网格与卡片 */
        .board-container {
            width: 320px;
            height: 320px;
            background-color: var(--grid-bg);
            border-radius: 0.75rem;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            position: relative;
            touch-action: none;
            user-select: none;
        }
        .grid-cell {
            background-color: var(--cell-empty);
            border-radius: 0.5rem;
        }
        .tile {
            position: absolute;
            width: 65px;
            height: 65px;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            transition: transform 0.12s ease-in-out;
        }
        /* 数字配色 */
        .v-2 { background: #e0f2fe; color: #0369a1; }
        .v-4 { background: #bae6fd; color: #0284c7; }
        .v-8 { background: #38bdf8; color: #ffffff; }
        .v-16 { background: #60a5fa; color: #ffffff; }
        .v-32 { background: #3b82f6; color: #ffffff; }
        .v-64 { background: #2563eb; color: #ffffff; }
        .v-128 { background: #f59e0b; color: #ffffff; font-size: 1.25rem; }
        .v-256 { background: #d97706; color: #ffffff; font-size: 1.25rem; }
        .v-512 { background: #10b981; color: #ffffff; font-size: 1.25rem; }
        .v-1024 { background: #059669; color: #ffffff; font-size: 1rem; }
        .v-2048 { background: #8b5cf6; color: #ffffff; font-size: 1rem; box-shadow: 0 0 15px rgba(139,92,246,0.6); }
        .v-super { background: #ec4899; color: #ffffff; font-size: 0.875rem; }
    </style>
</head>
<body class="flex flex-col">
    <header class="nav-bar-bg sticky top-0 z-10 border-b">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/toolkit/index.html" class="btn btn-outline flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i><span>返回首页</span>
            </a>
            <h1 class="text-xl font-bold text-gradient"><i class="fa-solid fa-th-large mr-2"></i>2048 数字合体</h1>
            <button id="themeToggle" class="btn btn-outline" title="切换深浅主题">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-md flex-grow">
        <div class="tool-card p-4 sm:p-6 rounded-2xl space-y-4">
            
            <div class="flex items-center justify-between bg-[var(--card-sub)] p-3 rounded-xl">
                <div class="flex gap-2">
                    <button id="btnNew" class="btn btn-primary text-sm"><i class="fa-solid fa-rotate-right mr-1"></i>新游戏</button>
                    <button id="btnUndo" class="btn btn-outline text-sm"><i class="fa-solid fa-arrow-rotate-left mr-1"></i>撤销</button>
                </div>
                <div class="flex items-center gap-4 text-sm font-semibold">
                    <div>得分: <span id="scoreTxt" class="text-primary text-base font-bold">0</span></div>
                    <div>最高: <span id="bestTxt" class="text-amber-400 text-base font-bold">0</span></div>
                </div>
            </div>

            <!-- 棋盘容器 -->
            <div class="flex justify-center">
                <div id="board" class="board-container">
                    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                    <div id="tilesContainer"></div>
                </div>
            </div>

            <div class="text-xs text-sub-color text-center border-t border-[var(--border)] pt-3">
                💡 电脑端按 <kbd class="px-1 border rounded">↑</kbd> <kbd class="px-1 border rounded">↓</kbd> <kbd class="px-1 border rounded">←</kbd> <kbd class="px-1 border rounded">→</kbd> 移动；手机端可在盘面上滑动操作。
            </div>
        </div>
    </main>

    <!-- 弹窗 -->
    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="tool-card p-6 rounded-2xl max-w-sm w-full text-center space-y-4 shadow-2xl">
            <div id="modalEmoji" class="text-5xl">🎉</div>
            <h2 id="modalTitle" class="text-2xl font-bold text-gradient">达成 2048！</h2>
            <p id="modalBody" class="text-sub-color">得分: 20480</p>
            <button id="btnModalAgain" class="btn btn-primary w-full py-2.5 font-bold">再玩一次</button>
        </div>
    </div>

    <footer class="nav-bar-bg border-t py-6 mt-10">
        <div class="container mx-auto px-4 text-center text-sub-color text-sm">
            <p>悟已往之不谏，知来者之可追</p>
            <p class="mt-1">© 2026 工具集 | 经典小游戏</p>
        </div>
    </footer>

<script>
function initTheme(){
    const t = localStorage.getItem("toolTheme") || "dark";
    document.documentElement.setAttribute("data-theme", t);
    updateThemeIcon(t);
}
function updateThemeIcon(t){
    document.getElementById("themeIcon").className = t === "dark" ? "fa-solid fa-moon" : "fa-solid fa-sun";
}
document.getElementById("themeToggle").onclick = () => {
    const c = document.documentElement.getAttribute("data-theme");
    const n = c === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", n);
    localStorage.setItem("toolTheme", n);
    updateThemeIcon(n);
};

const board = document.getElementById('board');
const tilesContainer = document.getElementById('tilesContainer');
const scoreTxt = document.getElementById('scoreTxt');
const bestTxt = document.getElementById('bestTxt');
const btnNew = document.getElementById('btnNew');
const btnUndo = document.getElementById('btnUndo');
const modal = document.getElementById('modal');
const modalEmoji = document.getElementById('modalEmoji');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const btnModalAgain = document.getElementById('btnModalAgain');

let grid = Array(4).fill().map(() => Array(4).fill(0));
let score = 0;
let best = Number(localStorage.getItem('2048Best') || 0);
let history = [];
let hasWon = false;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type){
    try {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;
        if(type === 'move'){
            osc.frequency.setValueAtTime(220, now);
            gain.gain.setValueAtTime(0.03, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.05);
        } else if(type === 'merge'){
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.08);
        }
    } catch(e){}
}

function initGame(){
    grid = Array(4).fill().map(() => Array(4).fill(0));
    score = 0;
    history = [];
    hasWon = false;
    bestTxt.innerText = best;
    modal.classList.add('hidden');
    addTile(); addTile();
    render();
}

function saveHistory(){
    history.push({ grid: grid.map(r => [...r]), score });
    if(history.length > 10) history.shift();
}

btnUndo.onclick = () => {
    if(history.length === 0) return;
    const last = history.pop();
    grid = last.grid;
    score = last.score;
    render();
};

function addTile(){
    const empty = [];
    for(let r=0; r<4; r++){
        for(let c=0; c<4; c++){
            if(grid[r][c] === 0) empty.push({r, c});
        }
    }
    if(empty.length > 0){
        const {r, c} = empty[Math.floor(Math.random() * empty.length)];
        grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }
}

function getPos(r, c){
    return { left: 10 + c * 75 + 'px', top: 10 + r * 75 + 'px' };
}

function render(){
    tilesContainer.innerHTML = '';
    for(let r=0; r<4; r++){
        for(let c=0; c<4; c++){
            const val = grid[r][c];
            if(val > 0){
                const tile = document.createElement('div');
                const pos = getPos(r, c);
                const cls = val <= 2048 ? `v-${val}` : 'v-super';
                tile.className = `tile ${cls}`;
                tile.style.left = pos.left;
                tile.style.top = pos.top;
                tile.innerText = val;
                tilesContainer.appendChild(tile);
            }
        }
    }
    scoreTxt.innerText = score;
    if(score > best){
        best = score;
        localStorage.setItem('2048Best', best);
        bestTxt.innerText = best;
    }
}

function move(dir){
    saveHistory();
    let moved = false;
    let mergedScore = 0;

    const rotate = (g) => g[0].map((_, colIndex) => g.map(row => row[colIndex]).reverse());

    let temp = grid.map(r => [...r]);
    let rotations = 0;

    if(dir === 'left') rotations = 0;
    else if(dir === 'down') rotations = 1;
    else if(dir === 'right') rotations = 2;
    else if(dir === 'up') rotations = 3;

    for(let i=0; i<rotations; i++) temp = rotate(temp);

    for(let r=0; r<4; r++){
        let row = temp[r].filter(v => v !== 0);
        for(let c=0; c<row.length-1; c++){
            if(row[c] === row[c+1]){
                row[c] *= 2;
                mergedScore += row[c];
                row[c+1] = 0;
                if(row[c] === 2048 && !hasWon) checkWin();
            }
        }
        row = row.filter(v => v !== 0);
        while(row.length < 4) row.push(0);
        if(row.join(',') !== temp[r].join(',')) moved = true;
        temp[r] = row;
    }

    for(let i=0; i<(4 - rotations) % 4; i++) temp = rotate(temp);

    if(moved){
        grid = temp;
        score += mergedScore;
        if(mergedScore > 0) playSound('merge');
        else playSound('move');
        addTile();
        render();
        checkGameOver();
    } else {
        history.pop();
    }
}

function checkWin(){
    hasWon = true;
    modalEmoji.innerText = '🏆';
    modalTitle.innerText = '成功合成 2048！';
    modalBody.innerText = `当前得分: ${score}`;
    modal.classList.remove('hidden'); modal.classList.add('flex');
}

function checkGameOver(){
    for(let r=0; r<4; r++){
        for(let c=0; c<4; c++){
            if(grid[r][c] === 0) return;
            if(r < 3 && grid[r][c] === grid[r+1][c]) return;
            if(c < 3 && grid[r][c] === grid[r][c+1]) return;
        }
    }
    modalEmoji.innerText = '😵';
    modalTitle.innerText = '棋盘已满！';
    modalBody.innerText = `最终得分: ${score}`;
    modal.classList.remove('hidden'); modal.classList.add('flex');
}

// 触摸与键盘响应
let touchStartX = 0, touchStartY = 0;
board.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, {passive: true});

board.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > 30 || Math.abs(dy) > 30){
        if(Math.abs(dx) > Math.abs(dy)){
            move(dx > 0 ? 'right' : 'left');
        } else {
            move(dy > 0 ? 'down' : 'up');
        }
    }
}, {passive: true});

document.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft' || e.key === 'a') move('left');
    else if(e.key === 'ArrowRight' || e.key === 'd') move('right');
    else if(e.key === 'ArrowUp' || e.key === 'w') move('up');
    else if(e.key === 'ArrowDown' || e.key === 's') move('down');
});

btnNew.onclick = initGame;
btnModalAgain.onclick = initGame;

initTheme();
initGame();
</script>
</body>
</html>
