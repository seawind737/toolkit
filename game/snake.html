<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    colors: { primary: '#3b82f6' },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient { @apply bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-400; }
            .btn { @apply px-4 py-2 rounded-lg transition-all duration-200; }
            .btn-primary { @apply bg-primary text-white hover:bg-primary/80; }
            .btn-outline { @apply border border-[var(--border)] hover:bg-[var(--card-sub)]; }
        }
        html[data-theme="dark"] {
            --bg: #0f172a;--card: #1e293b;--card-sub: #334155;--border: #475569;
            --text-main: #e2e8f0;--text-sub: #94a3b8;
        }
        html[data-theme="light"] {
            --bg: #f8fafc;--card: #ffffff;--card-sub: #e2e8f0;--border: #cbd5e1;
            --text-main: #111827;--text-sub: #64748b;
        }
        body {
            background-color: var(--bg); color: var(--text-main);
            transition: background-color 0.35s ease, color 0.35s ease; min-height:100vh;
        }
        body::before{
            content:"";position:fixed;inset:0;z-index:-1;opacity:0.45;pointer-events:none;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size:24px 24px;
        }
        html[data-theme="light"] body::before{
            background-image: linear-gradient(rgba(59,130,246,0.04) 1px,transparent 1px),
            linear-gradient(90deg,rgba(59,130,246,0.04) 1px,transparent 1px);
            background-size:28px 28px;
        }
        .nav-bar-bg { background-color: var(--card); border-color: var(--border); transition:0.35s; }
        .tool-card { background-color: var(--card); border:1px solid var(--border); box-shadow:0 2px 12px rgba(0,0,0,0.08); }
        .text-sub-color { color: var(--text-sub); }
        canvas{border:1px solid var(--border);}
    </style>
</head>
<body class="flex flex-col">
    <header class="nav-bar-bg sticky top-0 z-10 border-b">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/toolkit/index.html" class="btn btn-outline flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i><span>返回首页</span>
            </a>
            <h1 class="text-xl font-bold text-gradient">🐍 贪吃蛇</h1>
            <button id="themeToggle" class="btn btn-outline" title="切换深浅主题">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </header>
    <main class="container mx-auto px-4 py-8 max-w-6xl flex-grow">
        <div class="tool-card p-6 rounded-xl">
            <div class="flex flex-wrap gap-4 mb-4 items-center">
                <button id="btnStart" class="btn btn-primary"><i class="fa-solid fa-play"></i>开始/重置</button>
                <div>分数：<span id="scoreEl" class="font-bold">0</span></div>
                <div>最高分：<span id="bestEl" class="font-bold text-amber-400">0</span></div>
            </div>
            <div class="text-sub-color text-sm mb-3">键盘方向键控制，手机可以点下方按钮</div>
            <canvas id="canvas"></canvas>
            <div class="mt-4 grid grid-cols-3 w-36 gap-2">
                <div></div>
                <button id="btnUp" class="btn btn-outline">↑</button>
                <div></div>
                <button id="btnLeft" class="btn btn-outline">←</button>
                <button id="btnDown" class="btn btn-outline">↓</button>
                <button id="btnRight" class="btn btn-outline">→</button>
            </div>
        </div>
    </main>
    <footer class="nav-bar-bg border-t py-6 mt-10">
        <div class="container mx-auto px-4 text-center text-sub-color text-sm">
            <p>悟已往之不谏，知来者之可追</p>
            <p class="mt-1">© 2026 工具集 | 小游戏</p>
        </div>
    </footer>
    <script>
        function initTheme(){
            const t=localStorage.getItem("toolTheme")||"dark";
            document.documentElement.setAttribute("data-theme",t);
            updateThemeIcon(t);
        }
        function updateThemeIcon(t){
            document.getElementById("themeIcon").className = t==="dark"?"fa-solid fa-moon":"fa-solid fa-sun";
        }
        document.getElementById("themeToggle").onclick=()=>{
            const c=document.documentElement.getAttribute("data-theme");
            const n=c==="dark"?"light":"dark";
            document.documentElement.setAttribute("data-theme",n);
            localStorage.setItem("toolTheme",n);
            updateThemeIcon(n);
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btnStart = document.getElementById('btnStart');
        const scoreEl = document.getElementById('scoreEl');
        const bestEl = document.getElementById('bestEl');
        const btnUp = document.getElementById('btnUp');
        const btnDown = document.getElementById('btnDown');
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');

        const CELL=18;
        const COLS=24;
        const ROWS=20;
        canvas.width = COLS*CELL;
        canvas.height = ROWS*CELL;

        let snake = [];
        let food = {x:0,y:0};
        let dir = {dx:1, dy:0};
        let nextDir = {dx:1, dy:0};
        let score =0;
        let best = Number(localStorage.getItem('snakeBest')||0);
        let timer = null;
        let gameOver = false;

        bestEl.innerText = best;

        function spawnFood(){
            let x,y;
            while(true){
                x = Math.floor(Math.random()*COLS);
                y = Math.floor(Math.random()*ROWS);
                const hitSnake = snake.some(p=>p.x===x&&p.y===y);
                if(!hitSnake) break;
            }
            food = {x,y};
        }
        function init(){
            if(timer) clearInterval(timer);
            snake = [{x:3,y:10},{x:2,y:10},{x:1,y:10}];
            dir = {dx:1,dy:0};
            nextDir = {dx:1,dy:0};
            score=0;
            scoreEl.innerText=score;
            gameOver=false;
            spawnFood();
            draw();
            timer = setInterval(update,130);
        }
        function draw(){
            const isDark = document.documentElement.dataset.theme==='dark';
            ctx.fillStyle = isDark ? '#0f172a':'#ffffff';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle='#22c55e';
            snake.forEach(p=>{
                ctx.fillRect(p.x*CELL+1,p.y*CELL+1,CELL-2,CELL-2);
            })
            ctx.fillStyle='#ef4444';
            ctx.fillRect(food.x*CELL+1,food.y*CELL+1,CELL-2,CELL-2);
        }
        function update(){
            if(gameOver) return;
            dir = {...nextDir};
            const head = {...snake[0]};
            head.x += dir.dx;
            head.y += dir.dy;
            if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS){
                gameOver=true;
                clearInterval(timer);
                if(score>best){
                    best=score;
                    localStorage.setItem('snakeBest',best);
                    bestEl.innerText=best;
                }
                alert('游戏结束，分数：'+score);
                return;
            }
            if(snake.some(p=>p.x===head.x&&p.y===head.y)){
                gameOver=true;
                clearInterval(timer);
                if(score>best){
                    best=score;
                    localStorage.setItem('snakeBest',best);
                    bestEl.innerText=best;
                }
                alert('撞到自己！分数：'+score);
                return;
            }
            snake.unshift(head);
            if(head.x===food.x && head.y===food.y){
                score++;
                scoreEl.innerText=score;
                spawnFood();
            }else{
                snake.pop();
            }
            draw();
        }
        function setDir(dx,dy){
            if(dir.dx === -dx && dir.dy === -dy) return;
            nextDir = {dx,dy};
        }
        document.addEventListener('keydown',e=>{
            if(e.key==='ArrowUp') setDir(0,-1);
            if(e.key==='ArrowDown') setDir(0,1);
            if(e.key==='ArrowLeft') setDir(-1,0);
            if(e.key==='ArrowRight') setDir(1,0);
        })
        btnUp.onclick = ()=>setDir(0,-1);
        btnDown.onclick = ()=>setDir(0,1);
        btnLeft.onclick = ()=>setDir(-1,0);
        btnRight.onclick = ()=>setDir(1,0);
        btnStart.onclick = init;
        init();
        initTheme();
    </script>
</body>
</html>
