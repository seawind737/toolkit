<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON TOOL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    colors: { primary: '#3b82f6' },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['Consolas', 'Monaco', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        .text-gradient { background-clip: text; -webkit-background-clip: text; color: transparent; background-image: linear-gradient(to right, #60a5fa, #22d3ee); }
        .btn { padding: 0.4rem 0.85rem; border-radius: 0.5rem; transition: all 0.2s; font-size: 0.8rem; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; white-space: nowrap; font-weight: 600; }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: rgba(59, 130, 246, 0.85); }
        .btn-outline { border: 1px solid var(--border); background-color: var(--card); color: var(--text-main); }
        .btn-outline:hover { background-color: var(--card-sub); }

        html[data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --card-sub: #334155; --border: #475569; --text-main: #e2e8f0; --text-sub: #94a3b8; --input-bg: #020617; }
        html[data-theme="light"] { --bg: #f8fafc; --card: #ffffff; --card-sub: #e2e8f0; --border: #cbd5e1; --text-main: #111827; --text-sub: #64748b; --input-bg: #f8fafc; }

        body { background-color: var(--bg); color: var(--text-main); transition: background-color 0.35s ease, color 0.35s ease; min-height: 100vh; }
        body::before { content: ""; position: fixed; inset: 0; z-index: -1; opacity: 0.45; pointer-events: none; background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 24px 24px; }
        .nav-bar-bg { background-color: var(--card); border-color: var(--border); transition: 0.35s; }
        .tool-card { background-color: var(--card); border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

        input, textarea { background-color: var(--input-bg); border: 1px solid var(--border); color: var(--text-main); padding: 0.4rem 0.6rem; border-radius: 0.375rem; font-size: 0.8rem; font-family: Consolas, monospace; }
        input:focus, textarea:focus { outline: none; border-color: #3b82f6; }

        /* JSON-Handle 树形样式 */
        .json-tree { font-family: Consolas, Menlo, monospace; font-size: 13px; line-height: 1.6; }
        .json-tree-item { padding-left: 18px; position: relative; }
        .json-tree-toggle { cursor: pointer; user-select: none; display: inline-block; width: 16px; color: var(--text-sub); text-align: center; }
        .json-key { color: #60a5fa; cursor: pointer; font-weight: 600; }
        .json-key:hover { text-decoration: underline; }
        .json-string { color: #34d399; }
        .json-number { color: #fbbf24; }
        .json-bool { color: #f43f5e; }
        .json-null { color: #94a3b8; font-style: italic; }
        .node-selected { background-color: rgba(59, 130, 246, 0.15); border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col">
    <header class="nav-bar-bg sticky top-0 z-10 border-b">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/toolkit/index.html" class="btn btn-outline flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i><span>返回首页</span></a>
            <h1 class="text-xl font-bold text-gradient"><i class="fa-solid fa-sitemap mr-2"></i>JSON-TOOL</h1>
            <button id="themeToggle" class="btn btn-outline" title="切换深浅主题"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-7xl flex-grow space-y-5">
        
        <!-- 顶部输入区域 -->
        <div class="tool-card p-4 rounded-2xl space-y-3">
            <div class="flex justify-between items-center text-xs">
                <span class="font-bold text-[var(--text-sub)]"><i class="fa-solid fa-pen-to-square mr-1 text-primary"></i>输入 JSON 源码</span>
                <div class="flex items-center gap-2">
                    <button id="btnLoad" class="btn btn-primary text-xs py-1.5"><i class="fa-solid fa-play mr-1"></i>解析并加载</button>
                    <button id="btnSample" class="btn btn-outline text-xs py-1.5"><i class="fa-solid fa-wand-magic-sparkles text-amber-400 mr-1"></i>加载示例</button>
                    <button id="btnClear" class="btn btn-outline text-xs py-1.5 text-red-400"><i class="fa-solid fa-eraser mr-1"></i>清空</button>
                </div>
            </div>
            <textarea id="quickInput" rows="4" class="w-full text-xs font-mono p-3 rounded-xl resize-y" placeholder="在此粘贴您的 JSON 文本（支持多层级对象与数组嵌套）..."></textarea>
        </div>

        <!-- 主体双栏：左侧树形导航 | 右侧详情查看器 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            
            <!-- 左侧：树形结构导航 (占 5 列) -->
            <div class="tool-card p-4 rounded-2xl lg:col-span-5 flex flex-col space-y-3">
                <div class="flex justify-between items-center text-xs border-b border-[var(--border)] pb-2.5">
                    <span class="font-bold text-[var(--text-sub)]"><i class="fa-solid fa-folder-tree mr-1 text-primary"></i>JSON 树形导航</span>
                    <div class="flex gap-1.5">
                        <button id="btnExpandAll" class="btn btn-outline text-[10px] py-1 px-2">+ 展开全部分支</button>
                        <button id="btnCollapseAll" class="btn btn-outline text-[10px] py-1 px-2">- 折叠全部分支</button>
                    </div>
                </div>
                <div id="treeContainer" class="w-full h-[520px] overflow-auto json-tree p-3 bg-[var(--input-bg)] rounded-xl border border-[var(--border)]">
                    <div class="text-xs text-[var(--text-sub)] text-center py-40">请在上方输入 JSON 并点击解析加载...</div>
                </div>
            </div>

            <!-- 右侧：节点详情与内容查看器 (占 7 列) -->
            <div class="tool-card p-4 rounded-2xl lg:col-span-7 flex flex-col space-y-4">
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-[var(--text-sub)]">Path (当前节点路径)</label>
                    <input id="nodePath" type="text" readonly class="w-full font-mono text-xs bg-[var(--card-sub)]" value="JSON">
                </div>

                <div class="flex flex-wrap items-center gap-3">
                    <div class="flex-1 space-y-1">
                        <label class="text-[11px] font-bold text-[var(--text-sub)]">Key (当前键名)</label>
                        <input id="nodeKey" type="text" readonly class="w-full font-mono text-xs bg-[var(--card-sub)]" value="JSON">
                    </div>
                    <div class="flex items-end gap-2 pt-4">
                        <button id="btnCopyContent" class="btn btn-primary text-xs"><i class="fa-solid fa-copy mr-1"></i>复制当前内容</button>
                        <button id="btnCompress" class="btn btn-outline text-xs bg-emerald-600/20 text-emerald-400 border-emerald-500/30 hover:bg-emerald-600/30"><i class="fa-solid fa-compress mr-1"></i>压缩</button>
                    </div>
                </div>

                <div class="flex flex-col space-y-1.5 flex-grow">
                    <div class="flex justify-between items-center text-[11px]">
                        <span class="font-bold text-[var(--text-sub)]">Value / Children Preview (当前内容预览)</span>
                        <span id="nodeTypeTag" class="text-[10px] px-2 py-0.5 rounded bg-blue-500/20 text-blue-400 font-mono">Object</span>
                    </div>
                    <textarea id="nodeContent" rows="16" readonly class="w-full font-mono text-xs p-3 rounded-xl bg-[var(--input-bg)] resize-none" placeholder="点击左侧任意节点查看详细内容..."></textarea>
                </div>
            </div>

        </div>

    </main>

    <footer class="nav-bar-bg border-t py-6 mt-10">
        <div class="container mx-auto px-4 text-center text-[var(--text-sub)] text-sm">
            <p>悟已往之不谏，知来者之可追</p>
            <p class="mt-1">© 2026 开发者工具箱 | JSON-Handle 插件风格视图</p>
        </div>
    </footer>

<script>
function initTheme(){
    const t = localStorage.getItem("toolTheme") || "dark";
    document.documentElement.setAttribute("data-theme", t);
    document.getElementById("themeIcon").className = t === "dark" ? "fa-solid fa-moon" : "fa-solid fa-sun";
}
document.getElementById("themeToggle").onclick = () => {
    const c = document.documentElement.getAttribute("data-theme");
    const n = c === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", n);
    localStorage.setItem("toolTheme", n);
    document.getElementById("themeIcon").className = n === "dark" ? "fa-solid fa-moon" : "fa-solid fa-sun";
};
initTheme();

const quickInput = document.getElementById('quickInput');
const treeContainer = document.getElementById('treeContainer');
const nodePath = document.getElementById('nodePath');
const nodeKey = document.getElementById('nodeKey');
const nodeContent = document.getElementById('nodeContent');
const nodeTypeTag = document.getElementById('nodeTypeTag');

let globalJsonData = null;

const sampleJson = {
    "l1": {
        "l1_1": ["l1_1_1", "l1_1_2"],
        "l1_2": [
            { "decode name": "URIComponent", "sample": "https%3A%2F%2Fjsonhandle.sinaapp.com" },
            { "decode name": "Base64", "sample": "aHR0cHM6Ly9qc29uaGFuZGxl..." }
        ]
    },
    "l2": {
        "l2_1": null,
        "l2_2": true,
        "l2_3": {}
    }
};

document.getElementById('btnSample').onclick = () => {
    quickInput.value = JSON.stringify(sampleJson, null, 2);
    parseAndRender(sampleJson);
};

document.getElementById('btnClear').onclick = () => {
    quickInput.value = "";
    treeContainer.innerHTML = `<div class="text-xs text-[var(--text-sub)] text-center py-40">请在上方输入 JSON 并点击解析加载...</div>`;
    nodePath.value = "JSON";
    nodeKey.value = "JSON";
    nodeContent.value = "";
    globalJsonData = null;
};

document.getElementById('btnLoad').onclick = () => {
    try {
        const obj = JSON.parse(quickInput.value.trim());
        parseAndRender(obj);
    } catch(e) {
        alert("JSON 解析错误: " + e.message);
    }
};

quickInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && e.ctrlKey){
        try {
            const obj = JSON.parse(quickInput.value.trim());
            parseAndRender(obj);
        } catch(err){}
    }
});

function parseAndRender(data){
    globalJsonData = data;
    treeContainer.innerHTML = buildTreeHtml(data, "JSON", "JSON");
    bindTreeInteractions();
    selectNode("JSON", "JSON", data);
}

// 递归构建树形 HTML
function buildTreeHtml(obj, path, keyName){
    let html = "";
    const isArr = Array.isArray(obj);
    const isContainer = (typeof obj === "object" && obj !== null);

    if(isContainer){
        const keys = Object.keys(obj);
        const openChar = isArr ? "[" : "{";
        const closeChar = isArr ? "]" : "}";
        const count = keys.length;

        html += `<div class="json-tree-item" data-path="${escapeAttr(path)}" data-key="${escapeAttr(keyName)}">`;
        html += `<span class="json-tree-toggle"><i class="fa-solid fa-chevron-down text-[10px]"></i></span>`;
        html += `<span class="json-key font-bold" onclick="handleNodeClick('${escapeAttr(path)}', '${escapeAttr(keyName)}')">${escapeHtml(keyName)}</span> <span class="text-[var(--text-sub)]">${openChar}</span>`;
        html += `<div class="json-tree-children pl-4 space-y-0.5">`;

        keys.forEach(k => {
            const childKey = isArr ? `[${k}]` : k;
            // 对于带有空格或特殊字符的键名，使用方括号语法拼接路径，确保路径解析100%准确
            const childPath = isArr ? `${path}[${k}]` : (/^[a-zA-Z0-9_$]+$/.test(k) ? `${path}.${k}` : `${path}["${k}"]`);
            html += buildTreeHtml(obj[k], childPath, childKey);
        });

        html += `</div>`;
        html += `<span class="text-[var(--text-sub)]">${closeChar} <span class="text-[10px]">(${count})</span></span>`;
        html += `</div>`;
    } else {
        let valClass = "json-string";
        const type = typeof obj;
        if(type === "number") valClass = "json-number";
        else if(type === "boolean") valClass = "json-bool";
        else if(obj === null) valClass = "json-null";

        const displayVal = type === "string" ? `"${escapeHtml(obj)}"` : obj;
        html += `<div class="json-tree-item py-0.5" data-path="${escapeAttr(path)}" data-key="${escapeAttr(keyName)}">`;
        html += `<span class="json-tree-toggle"></span>`;
        html += `<span class="json-key" onclick="handleNodeClick('${escapeAttr(path)}', '${escapeAttr(keyName)}')">${escapeHtml(keyName)}</span>: <span class="${valClass}" onclick="handleNodeClick('${escapeAttr(path)}', '${escapeAttr(keyName)}')">${displayVal}</span>`;
        html += `</div>`;
    }
    return html;
}

function escapeHtml(str){
    if(!str) return "";
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(str){
    return String(str).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
}

function bindTreeInteractions(){
    document.querySelectorAll(".json-tree-toggle").forEach(tog => {
        if(!tog.closest(".json-tree-item").querySelector(".json-tree-children")) return;
        tog.onclick = function(e){
            e.stopPropagation();
            const item = this.closest(".json-tree-item");
            const child = item.querySelector(".json-tree-children");
            const icon = this.querySelector("i");
            if(child){
                if(child.classList.contains("hidden")){
                    child.classList.remove("hidden");
                    if(icon) icon.className = "fa-solid fa-chevron-down text-[10px]";
                } else {
                    child.classList.add("hidden");
                    if(icon) icon.className = "fa-solid fa-chevron-right text-[10px]";
                }
            }
        };
    });
}

// 升级版通用路径解析引擎：完美支持点语法、带空格的键名语法["key"]以及数组下标[0]
function resolvePath(root, pathStr){
    if(pathStr === "JSON") return root;
    let p = pathStr.replace(/^JSON/, "$");
    let cur = root;
    // 匹配 .key、["key"] 或 [index]
    const re = /\.([a-zA-Z0-9_$]+)|\["([^"]+)"\]|\['([^']+)'\]|\[(\d+)\]/g;
    let m;
    while((m = re.exec(p)) !== null){
        if(m[1]){
            cur = cur[m[1]];
        }else if(m[2]){
            cur = cur[m[2]];
        }else if(m[3]){
            cur = cur[m[3]];
        }else if(m[4] !== undefined){
            cur = cur[parseInt(m[4], 10)];
        }
    }
    return cur;
}

window.handleNodeClick = function(pathStr, keyName){
    if(!globalJsonData) return;

    const val = resolvePath(globalJsonData, pathStr);
    selectNode(pathStr, keyName, val);

    document.querySelectorAll(".json-tree-item").forEach(el => el.classList.remove("node-selected"));
    const targetItem = document.querySelector(`.json-tree-item[data-path="${pathStr.replace(/"/g, '\\"')}"]`);
    if(targetItem) targetItem.classList.add("node-selected");
};

function selectNode(path, key, val){
    nodePath.value = path;
    nodeKey.value = key;
    const t = Array.isArray(val) ? "Array" : (val === null ? "Null" : typeof val);
    nodeTypeTag.innerText = t.toUpperCase();

    if(typeof val === 'object' && val !== null){
        nodeContent.value = JSON.stringify(val, null, 2);
    } else {
        nodeContent.value = String(val);
    }
}

// 展开与折叠全部
document.getElementById('btnExpandAll').onclick = () => {
    document.querySelectorAll(".json-tree-children").forEach(el => el.classList.remove("hidden"));
    document.querySelectorAll(".json-tree-toggle i").forEach(i => i.className = "fa-solid fa-chevron-down text-[10px]");
};
document.getElementById('btnCollapseAll').onclick = () => {
    document.querySelectorAll(".json-tree-children").forEach(el => el.classList.add("hidden"));
    document.querySelectorAll(".json-tree-toggle i").forEach(i => i.className = "fa-solid fa-chevron-right text-[10px]");
};

// 复制当前内容
document.getElementById('btnCopyContent').onclick = async () => {
    if(!nodeContent.value) return;
    try {
        await navigator.clipboard.writeText(nodeContent.value);
        // alert("✅ 当前节点内容已成功复制！");
    } catch(e){
        alert("复制失败");
    }
};

// 节点内容压缩为单行
document.getElementById('btnCompress').onclick = () => {
    const p = nodePath.value;
    if(!globalJsonData) return;
    try {
        const res = resolvePath(globalJsonData, p);
        const compressed = JSON.stringify(res);
        nodeContent.value = compressed;
        navigator.clipboard.writeText(compressed);
        // alert("✅ 已将当前节点内容压缩为单行并复制到剪贴板！");
    } catch(e){
        alert("压缩失败: " + e.message);
    }
};

// 默认不加载示例，保持干净页面
</script>
</body>
</html>
