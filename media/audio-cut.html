<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音频裁剪与格式转换 - 在线工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root[data-theme="dark"] {
      --bg: #0f172a; --card: #1e293b; --sub-bg: #334155;
      --border: #475569; --text-main: #e2e8f0; --text-sub: #94a3b8;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc; --card: #ffffff; --sub-bg: #e2e8f0;
      --border: #cbd5e1; --text-main: #1e293b; --text-sub: #64748b;
    }
    body { background-color: var(--bg); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; }
    .text-sub { color: var(--text-sub); }
    .text-gradient {
      background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .btn { padding: 0.5rem 0.75rem; border-radius: 0.5rem; transition: all 0.2s; font-size: 0.875rem; cursor: pointer; }
    .btn-primary { background-color: #10b981; color: #ffffff; }
    .btn-primary:hover { opacity: 0.8; }
    .btn-outline { border: 1px solid var(--border); }
    .btn-outline:hover { background-color: var(--sub-bg); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="card !rounded-none border-x-0 border-t-0 p-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="/toolkit/index.html" class="btn btn-outline flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> 返回
      </a>
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-music text-[#10b981]"></i>
        <span class="text-gradient">音频裁剪与转换</span>
      </h1>
      <button id="themeToggle" class="btn btn-outline" title="切换主题">
        <i id="themeIcon" class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6">
    <section class="card p-6 border-dashed border-2 flex flex-col items-center justify-center cursor-pointer hover:border-[#10b981]" id="dropArea">
      <input type="file" id="fileInput" accept="audio/*" class="hidden">
      <i class="fa-solid fa-file-audio text-4xl text-sub mb-3"></i>
      <p class="font-medium mb-1">点击或拖拽音频文件至此处</p>
      <p class="text-xs text-sub">支持 MP3, WAV, OGG 等基础本地音频格式</p>
    </section>

    <!-- 操作区 -->
    <section class="card p-6 space-y-6 hidden" id="audioSection">
      <audio id="audioPlayer" controls class="w-full"></audio>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-xs text-sub block mb-1">起点时间 (秒)</label>
          <input type="number" id="startTime" value="0" step="0.1" min="0" class="btn btn-outline w-full bg-[var(--bg)]">
        </div>
        <div>
          <label class="text-xs text-sub block mb-1">终点时间 (秒)</label>
          <input type="number" id="endTime" value="0" step="0.1" min="0" class="btn btn-outline w-full bg-[var(--bg)]">
        </div>
      </div>

      <div class="flex justify-between items-center pt-2">
        <span class="text-xs text-sub">总时长: <span id="totalDuration">0</span>s</span>
        <button id="cutBtn" class="btn btn-primary"><i class="fa-solid fa-scissors mr-1"></i>导出裁剪音频 (WAV)</button>
      </div>
    </section>
  </main>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('toolTheme', theme);
      themeIcon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
    }
    applyTheme(localStorage.getItem('toolTheme') || 'dark');
    themeToggle.addEventListener('click', () => {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    const dropArea = document.getElementById('dropArea');
    const fileInput = document.getElementById('fileInput');
    const audioSection = document.getElementById('audioSection');
    const audioPlayer = document.getElementById('audioPlayer');
    const startTimeInput = document.getElementById('startTime');
    const endTimeInput = document.getElementById('endTime');
    const totalDuration = document.getElementById('totalDuration');
    const cutBtn = document.getElementById('cutBtn');

    let audioBuffer = null;
    let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    dropArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => { if(e.target.files.length) loadAudio(e.target.files[0]); });

    async function loadAudio(file) {
      const url = URL.createObjectURL(file);
      audioPlayer.src = url;
      audioSection.classList.remove('hidden');

      const arrayBuffer = await file.arrayBuffer();
      audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      
      const duration = audioBuffer.duration.toFixed(1);
      totalDuration.innerText = duration;
      startTimeInput.value = 0;
      endTimeInput.value = duration;
      endTimeInput.max = duration;
    }

    cutBtn.addEventListener('click', () => {
      if (!audioBuffer) return;
      const start = parseFloat(startTimeInput.value);
      const end = parseFloat(endTimeInput.value);

      if (start >= end) return alert('开始时间必须小于结束时间');

      const sampleRate = audioBuffer.sampleRate;
      const channels = audioBuffer.numberOfChannels;
      const frameCount = (end - start) * sampleRate;

      const newBuffer = audioCtx.createBuffer(channels, frameCount, sampleRate);

      for (let i = 0; i < channels; i++) {
        const channelData = audioBuffer.getChannelData(i);
        const newChannelData = newBuffer.getChannelData(i);
        const startOffset = Math.floor(start * sampleRate);
        for (let j = 0; j < frameCount; j++) {
          newChannelData[j] = channelData[startOffset + j];
        }
      }

      const wavBlob = bufferToWave(newBuffer, frameCount);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(wavBlob);
      a.download = `cut-${Date.now()}.wav`;
      a.click();
    });

    // Helper: AudioBuffer 到 WAV Blob 的本地转换
    function bufferToWave(abuffer, len) {
      let numOfChan = abuffer.numberOfChannels,
          length = len * numOfChan * 2 + 44,
          buffer = new ArrayBuffer(length),
          view = new DataView(buffer),
          channels = [], i, sample,
          offset = 0,
          pos = 0;

      function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); // "RIFF"
      setUint32(length - 8);
      setUint32(0x45564157); // "WAVE"
      setUint32(0x20746d66); // "fmt " chunk
      setUint32(16);
      setUint16(1);
      setUint16(numOfChan);
      setUint32(abuffer.sampleRate);
      setUint32(abuffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);
      setUint32(0x61746164); // "data" chunk
      setUint32(length - pos - 4);

      for (i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

      while (offset < len) {
        for (i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          view.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }
      return new Blob([buffer], { type: "audio/wav" });
    }
  </script>
</body>
</html>
