<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片滤镜 - 在线工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root[data-theme="dark"] {
      --bg: #0f172a; --card: #1e293b; --sub-bg: #334155;
      --border: #475569; --text-main: #e2e8f0; --text-sub: #94a3b8;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc; --card: #ffffff; --sub-bg: #e2e8f0;
      --border: #cbd5e1; --text-main: #1e293b; --text-sub: #64748b;
    }
    body { background-color: var(--bg); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; }
    .text-sub { color: var(--text-sub); }
    .text-gradient {
      background: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .btn { padding: 0.5rem 0.75rem; border-radius: 0.5rem; transition: all 0.2s; font-size: 0.875rem; cursor: pointer; }
    .btn-primary { background-color: #ec4899; color: #ffffff; }
    .btn-primary:hover { opacity: 0.8; }
    .btn-outline { border: 1px solid var(--border); }
    .btn-outline:hover { background-color: var(--sub-bg); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="card !rounded-none border-x-0 border-t-0 p-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="/toolkit/index.html" class="btn btn-outline flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> 返回
      </a>
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles text-[#ec4899]"></i>
        <span class="text-gradient">图片滤镜处理</span>
      </h1>
      <button id="themeToggle" class="btn btn-outline" title="切换主题">
        <i id="themeIcon" class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- 控件配置 -->
      <section class="card p-6 space-y-4">
        <input type="file" id="fileInput" accept="image/*" class="hidden">
        <button id="uploadBtn" class="btn btn-outline w-full"><i class="fa-solid fa-upload mr-2"></i>上传图片</button>

        <div class="space-y-3 pt-2">
          <div>
            <label class="text-xs text-sub block mb-1">亮度: <span id="val-brightness">100</span>%</label>
            <input type="range" id="brightness" min="0" max="200" value="100" class="w-full">
          </div>
          <div>
            <label class="text-xs text-sub block mb-1">对比度: <span id="val-contrast">100</span>%</label>
            <input type="range" id="contrast" min="0" max="200" value="100" class="w-full">
          </div>
          <div>
            <label class="text-xs text-sub block mb-1">灰度/黑白: <span id="val-grayscale">0</span>%</label>
            <input type="range" id="grayscale" min="0" max="100" value="0" class="w-full">
          </div>
          <div>
            <label class="text-xs text-sub block mb-1">复古 (Sepia): <span id="val-sepia">0</span>%</label>
            <input type="range" id="sepia" min="0" max="100" value="0" class="w-full">
          </div>
          <div>
            <label class="text-xs text-sub block mb-1">模糊 (Blur): <span id="val-blur">0</span>px</label>
            <input type="range" id="blur" min="0" max="10" value="0" class="w-full">
          </div>
        </div>

        <div class="flex gap-2 pt-2">
          <button id="resetBtn" class="btn btn-outline w-1/2">重置参数</button>
          <button id="downloadBtn" class="btn btn-primary w-1/2">保存结果</button>
        </div>
      </section>

      <!-- 结果预览区 -->
      <section class="card p-6 md:col-span-2 flex items-center justify-center overflow-auto min-h-[350px]">
        <canvas id="canvas" class="max-w-full hidden rounded border border-[var(--border)]"></canvas>
        <p id="placeholder" class="text-sub">请先上传图片进行滤镜调整</p>
      </section>
    </div>
  </main>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('toolTheme', theme);
      themeIcon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
    }
    applyTheme(localStorage.getItem('toolTheme') || 'dark');
    themeToggle.addEventListener('click', () => {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const canvas = document.getElementById('canvas');
    const placeholder = document.getElementById('placeholder');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    const controls = ['brightness', 'contrast', 'grayscale', 'sepia', 'blur'];
    let sourceImg = null;

    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (!e.target.files.length) return;
      const file = e.target.files[0];
      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = () => {
        sourceImg = img;
        placeholder.classList.add('hidden');
        canvas.classList.remove('hidden');
        render();
      };
    });

    controls.forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input', () => {
        document.getElementById(`val-${id}`).innerText = el.value;
        render();
      });
    });

    function render() {
      if (!sourceImg) return;
      const ctx = canvas.getContext('2d');
      canvas.width = sourceImg.width;
      canvas.height = sourceImg.height;

      const b = document.getElementById('brightness').value;
      const c = document.getElementById('contrast').value;
      const g = document.getElementById('grayscale').value;
      const s = document.getElementById('sepia').value;
      const bl = document.getElementById('blur').value;

      ctx.filter = `brightness(${b}%) contrast(${c}%) grayscale(${g}%) sepia(${s}%) blur(${bl}px)`;
      ctx.drawImage(sourceImg, 0, 0);
    }

    resetBtn.addEventListener('click', () => {
      document.getElementById('brightness').value = 100;
      document.getElementById('contrast').value = 100;
      document.getElementById('grayscale').value = 0;
      document.getElementById('sepia').value = 0;
      document.getElementById('blur').value = 0;
      controls.forEach(id => {
        document.getElementById(`val-${id}`).innerText = document.getElementById(id).value;
      });
      render();
    });

    downloadBtn.addEventListener('click', () => {
      if (!sourceImg) return;
      canvas.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `filter-img-${Date.now()}.png`;
        a.click();
      });
    });
  </script>
</body>
</html>
