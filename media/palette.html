<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>色板生成器 - 在线工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
  <style>
    :root[data-theme="dark"] {
      --bg: #0f172a; --card: #1e293b; --sub-bg: #334155;
      --border: #475569; --text-main: #e2e8f0; --text-sub: #94a3b8;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc; --card: #ffffff; --sub-bg: #e2e8f0;
      --border: #cbd5e1; --text-main: #1e293b; --text-sub: #64748b;
    }
    body { background-color: var(--bg); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; }
    .text-sub { color: var(--text-sub); }
    .text-gradient {
      background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .btn { padding: 0.5rem 0.75rem; border-radius: 0.5rem; transition: all 0.2s; font-size: 0.875rem; cursor: pointer; }
    .btn-outline { border: 1px solid var(--border); }
    .btn-outline:hover { background-color: var(--sub-bg); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="card !rounded-none border-x-0 border-t-0 p-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="/toolkit/index.html" class="btn btn-outline flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> 返回
      </a>
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-palette text-[#f59e0b]"></i>
        <span class="text-gradient">图片色板提取器</span>
      </h1>
      <button id="themeToggle" class="btn btn-outline" title="切换主题">
        <i id="themeIcon" class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6">
    <!-- 上传区域 -->
    <section class="card p-6 border-dashed border-2 flex flex-col items-center justify-center cursor-pointer hover:border-[#f59e0b]" id="dropArea">
      <input type="file" id="fileInput" accept="image/*" class="hidden">
      <i class="fa-solid fa-image text-4xl text-sub mb-3"></i>
      <p class="font-medium mb-1">选择或拖拽图片提取调色板</p>
      <p class="text-xs text-sub">自动提取调色板及 HEX / RGB 颜色代码</p>
    </section>

    <!-- 展现区域 -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="card p-4 flex items-center justify-center min-h-[250px]">
        <img id="imgPreview" class="max-h-64 max-w-full object-contain rounded hidden" alt="图片源">
        <p id="placeholder" class="text-sub text-sm">暂无图片</p>
      </div>

      <div class="card p-6 md:col-span-2 space-y-4">
        <h3 class="font-bold border-b pb-2 border-[var(--border)]">提取的主色调 & 调色板</h3>
        <div id="paletteContainer" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
          <p class="text-sub text-sm col-span-full">上传图片后自动展示色板...</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('toolTheme', theme);
      themeIcon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
    }
    applyTheme(localStorage.getItem('toolTheme') || 'dark');
    themeToggle.addEventListener('click', () => {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    const dropArea = document.getElementById('dropArea');
    const fileInput = document.getElementById('fileInput');
    const imgPreview = document.getElementById('imgPreview');
    const placeholder = document.getElementById('placeholder');
    const paletteContainer = document.getElementById('paletteContainer');

    const colorThief = new ColorThief();

    dropArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

    function handleFile(file) {
      const url = URL.createObjectURL(file);
      imgPreview.src = url;
      imgPreview.classList.remove('hidden');
      placeholder.classList.add('hidden');

      imgPreview.onload = () => {
        const palette = colorThief.getPalette(imgPreview, 6);
        renderPalette(palette);
      };
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    function renderPalette(palette) {
      paletteContainer.innerHTML = '';
      palette.forEach(rgb => {
        const hex = rgbToHex(...rgb);
        const item = document.createElement('div');
        item.className = 'card p-2 flex flex-col gap-2 cursor-pointer hover:scale-105 transition-transform';
        item.innerHTML = `
          <div class="h-16 rounded" style="background-color: ${hex}"></div>
          <div class="text-xs space-y-1 font-mono">
            <p class="font-bold">${hex.toUpperCase()}</p>
            <p class="text-sub">rgb(${rgb.join(', ')})</p>
          </div>
        `;
        item.addEventListener('click', () => {
          navigator.clipboard.writeText(hex).then(() => alert(`已复制颜色代码: ${hex}`));
        });
        paletteContainer.appendChild(item);
      });
    }
  </script>
</body>
</html>
