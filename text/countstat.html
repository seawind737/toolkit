<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本统计 - 专业多功能字数度量仪</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    colors: { primary: '#3b82f6' },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient { @apply bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-400; }
            .btn { @apply px-3.5 py-2 rounded-lg transition-all duration-200 text-xs flex items-center gap-1.5 cursor-pointer; }
            .btn-primary { @apply bg-primary text-white hover:bg-primary/80 font-bold; }
            .btn-outline { @apply border border-[var(--border)] hover:bg-[var(--card-sub)]; }
        }
        html[data-theme="dark"] {
            --bg: #0f172a; --card: #1e293b; --card-sub: #334155; --border: #475569;
            --text-main: #e2e8f0; --text-sub: #94a3b8;
        }
        html[data-theme="light"] {
            --bg: #f8fafc; --card: #ffffff; --card-sub: #e2e8f0; --border: #cbd5e1;
            --text-main: #111827; --text-sub: #64748b;
        }
        body {
            background-color: var(--bg); color: var(--text-main);
            transition: background-color 0.35s ease, color 0.35s ease; min-height: 100vh;
        }
        body::before{
            content:""; position:fixed; inset:0; z-index:-1; opacity:0.45; pointer-events:none;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .nav-bar-bg { background-color: var(--card); border-color: var(--border); transition: 0.35s; }
        .tool-card { background-color: var(--card); border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .sub-panel-bg { background-color: var(--card-sub); transition: transform 0.15s ease; }
        .sub-panel-bg:hover { transform: translateY(-2px); }
        .text-sub-color { color: var(--text-sub); }
        textarea {
            background-color: var(--card); border: 1px solid var(--border); color: var(--text-main);
            font-family: Consolas, Menlo, monospace;
        }
        textarea:focus { outline: none; border-color: #3b82f6; }
    </style>
</head>
<body class="flex flex-col">
    <header class="nav-bar-bg sticky top-0 z-10 border-b">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/toolkit/index.html" class="btn btn-outline">
                <i class="fa-solid fa-arrow-left"></i><span>返回首页</span>
            </a>
            <h1 class="text-xl font-bold text-gradient"><i class="fa-solid fa-file-lines mr-2"></i>专业文本统计仪</h1>
            <button id="themeToggle" class="btn btn-outline" title="切换深浅主题">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-6xl flex-grow space-y-6">
        <div class="tool-card p-6 rounded-2xl space-y-5">
            
            <!-- 输入上方快捷操作栏 -->
            <div class="flex flex-wrap items-center justify-between gap-3 bg-[var(--card-sub)] p-3 rounded-xl text-xs">
                <div class="flex flex-wrap items-center gap-2">
                    <button id="btnPaste" class="btn btn-outline"><i class="fa-solid fa-paste text-blue-400"></i>粘贴</button>
                    <button id="btnCopy" class="btn btn-outline"><i class="fa-solid fa-copy text-emerald-400"></i>复制文本</button>
                    <button id="btnUppercase" class="btn btn-outline"><i class="fa-solid fa-arrow-up text-amber-400"></i>转大写</button>
                    <button id="btnLowercase" class="btn btn-outline"><i class="fa-solid fa-arrow-down text-cyan-400"></i>转小写</button>
                </div>
                <div>
                    <button id="btnClear" class="btn btn-outline text-red-400"><i class="fa-solid fa-eraser"></i>清空内容</button>
                </div>
            </div>

            <textarea id="inputText" class="w-full h-48 p-4 rounded-xl resize-y text-xs leading-relaxed" placeholder="在此粘贴或输入需要统计的文本。支持实时计算；鼠标拖动选中部分文本，即可查看局部选中指标..."></textarea>

            <!-- 阅读时间估算提示 -->
            <div class="flex items-center gap-2 text-xs text-sub-color bg-[var(--card-sub)]/50 px-3.5 py-2 rounded-lg border border-[var(--border)]">
                <i class="fa-solid fa-book-open text-primary"></i>
                <span>预计阅读时间约：<strong id="readTime" class="text-white">0 秒</strong>（按正常语速计算）</span>
            </div>

            <!-- 全文统计看板 -->
            <div>
                <h3 class="font-bold text-sm mb-3 flex items-center gap-2"><i class="fa-solid fa-chart-pie text-primary"></i>全文深度统计指标</h3>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3.5 text-xs">
                    <div class="sub-panel-bg p-3.5 rounded-xl border border-[var(--border)]">
                        <div class="text-sub-color">总字符 (含空格)</div>
                        <div id="statAll" class="text-xl font-extrabold mt-1 text-blue-400">0</div>
                    </div>
                    <div class="sub-panel-bg p-3.5 rounded-xl border border-[var(--border)]">
                        <div class="text-sub-color">总字符 (不含空格)</div>
                        <div id="statNoSpace" class="text-xl font-extrabold mt-1">0</div>
                    </div>
                    <div class="sub-panel-bg p-3.5 rounded-xl border border-[var(--border)]">
                        <div class="text-sub-color">汉字数量</div>
                        <div id="statHan" class="text-xl font-extrabold mt-1 text-emerald-400">0</div>
                    </div>
                    <div class="sub-panel-bg p-3.5 rounded-xl border border-[var(--border)]">
                        <div class="text-sub-color">英文单词</div>
                        <div id="statWord" class="text-xl font-extrabold mt-1 text-cyan-400">0</div>
                    </div>
                    <div class="sub-panel-bg p-3.5 rounded-xl border border-[var(--border)]">
                        <div class="text-sub-color">数字个数</div>
                        <div id="statDigit" class="text-xl font-extrabold mt-1 text-amber-400">0</div>
                    </div>
                    <div class="sub-panel-bg p-3.5 rounded-xl border border-[var(--border)]">
                        <div class="text-sub-color">标点符号</div>
                        <div id="statPunct" class="text-xl font-extrabold mt-1">0</div>
                    </div>
                    <div class="sub-panel-bg p-3.5 rounded-xl border border-[var(--border)]">
                        <div class="text-sub-color">总行数</div>
                        <div id="statLine" class="text-xl font-extrabold mt-1">0</div>
                    </div>
                    <div class="sub-panel-bg p-3.5 rounded-xl border border-[var(--border)]">
                        <div class="text-sub-color">有效非空行</div>
                        <div id="statNotEmptyLine" class="text-xl font-extrabold mt-1">0</div>
                    </div>
                    <div class="sub-panel-bg p-3.5 rounded-xl border border-[var(--border)]">
                        <div class="text-sub-color">空白行数</div>
                        <div id="statEmptyLine" class="text-xl font-extrabold mt-1">0</div>
                    </div>
                    <div class="sub-panel-bg p-3.5 rounded-xl border border-[var(--border)]">
                        <div class="text-sub-color">最长单行长度</div>
                        <div id="statMaxCol" class="text-xl font-extrabold mt-1">0</div>
                    </div>
                </div>
            </div>

            <!-- 选中文本统计看板 -->
            <div class="pt-2">
                <h3 class="font-bold text-sm mb-3 flex items-center gap-2"><i class="fa-solid fa-highlighter text-emerald-400"></i>局部选中统计（拖动鼠标选中文本时自动生效）</h3>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5 text-xs">
                    <div class="sub-panel-bg p-3.5 rounded-xl border border-[var(--border)]">
                        <div class="text-sub-color">选中字符数</div>
                        <div id="selAll" class="text-xl font-extrabold mt-1">0</div>
                    </div>
                    <div class="sub-panel-bg p-3.5 rounded-xl border border-[var(--border)]">
                        <div class="text-sub-color">选中不含空格</div>
                        <div id="selNoSpace" class="text-xl font-extrabold mt-1">0</div>
                    </div>
                    <div class="sub-panel-bg p-3.5 rounded-xl border border-[var(--border)]">
                        <div class="text-sub-color">选中汉字</div>
                        <div id="selHan" class="text-xl font-extrabold mt-1">0</div>
                    </div>
                    <div class="sub-panel-bg p-3.5 rounded-xl border border-[var(--border)]">
                        <div class="text-sub-color">选中单词</div>
                        <div id="selWord" class="text-xl font-extrabold mt-1">0</div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="nav-bar-bg border-t py-6 mt-10">
        <div class="container mx-auto px-4 text-center text-sub-color text-sm">
            <p>悟已往之不谏，知来者之可追</p>
            <p class="mt-1">© 2026 工具集 | 文本度量与度量中心</p>
        </div>
    </footer>

    <script>
        function initTheme(){
            const t = localStorage.getItem("toolTheme") || "dark";
            document.documentElement.setAttribute("data-theme", t);
            updateThemeIcon(t);
        }
        function updateThemeIcon(t){
            document.getElementById("themeIcon").className = t === "dark" ? "fa-solid fa-moon" : "fa-solid fa-sun";
        }
        document.getElementById("themeToggle").onclick = () => {
            const c = document.documentElement.getAttribute("data-theme");
            const n = c === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", n);
            localStorage.setItem("toolTheme", n);
            updateThemeIcon(n);
        }

        const inputText = document.getElementById('inputText');
        const btnClear = document.getElementById('btnClear');
        const btnPaste = document.getElementById('btnPaste');
        const btnCopy = document.getElementById('btnCopy');
        const btnUppercase = document.getElementById('btnUppercase');
        const btnLowercase = document.getElementById('btnLowercase');
        const readTime = document.getElementById('readTime');

        // 全文统计 DOM
        const statAll = document.getElementById('statAll');
        const statNoSpace = document.getElementById('statNoSpace');
        const statHan = document.getElementById('statHan');
        const statWord = document.getElementById('statWord');
        const statDigit = document.getElementById('statDigit');
        const statPunct = document.getElementById('statPunct');
        const statLine = document.getElementById('statLine');
        const statEmptyLine = document.getElementById('statEmptyLine');
        const statSpace = document.getElementById('statSpace');
        const statNotEmptyLine = document.getElementById('statNotEmptyLine');
        const statMaxCol = document.getElementById('statMaxCol');

        // 选中文本 DOM
        const selAll = document.getElementById('selAll');
        const selNoSpace = document.getElementById('selNoSpace');
        const selHan = document.getElementById('selHan');
        const selWord = document.getElementById('selWord');

        function calcStats(text){
            const allLen = text.length;
            const spaceCount = (text.match(/ /g) || []).length;
            const noSpaceLen = text.replace(/\s/g, '').length;
            const hanArr = text.match(/[\u4e00-\u9fa5]/g) || [];
            const hanCount = hanArr.length;
            const wordArr = text.match(/[a-zA-Z]+/g) || [];
            const wordCount = wordArr.length;
            const digitArr = text.match(/[0-9]/g) || [];
            const digitCount = digitArr.length;
            
            // 安全兼容的标点符号匹配（避免旧环境或严格模式下 \p{P} 报错）
            const punctArr = text.match(/[！-／：-＠［-｀｛-～、。，！？；：“”（）《》【】\-\.,\?!;:\"\'\/\\_]/g) || [];
            const punctCount = punctArr.length;

            const lines = text.split(/\r?\n/);
            const totalLine = lines.length;
            let emptyLine = 0;
            let notEmptyLine = 0;
            let maxLineLen = 0;
            lines.forEach(line => {
                const trim = line.trim();
                if(trim === '') emptyLine++;
                else notEmptyLine++;
                if(line.length > maxLineLen) maxLineLen = line.length;
            });

            return {
                allLen, noSpaceLen, hanCount, wordCount, digitCount, punctCount,
                totalLine, emptyLine, spaceCount, notEmptyLine, maxLineLen
            };
        }

        function renderFull(){
            const txt = inputText.value;
            const s = calcStats(txt);
            statAll.innerText = s.allLen;
            statNoSpace.innerText = s.noSpaceLen;
            statHan.innerText = s.hanCount;
            statWord.innerText = s.wordCount;
            statDigit.innerText = s.digitCount;
            statPunct.innerText = s.punctCount;
            statLine.innerText = s.totalLine;
            statEmptyLine.innerText = s.emptyLine;
            statNotEmptyLine.innerText = s.notEmptyLine;
            statMaxCol.innerText = s.maxLineLen;

            // 阅读时间估算：中文约每分钟 300 字，英文约每分钟 200 词
            const seconds = Math.ceil((s.hanCount / 300 + s.wordCount / 200) * 60);
            if(seconds < 60) {
                readTime.innerText = `${seconds} 秒`;
            } else {
                const mins = (seconds / 60).toFixed(1);
                readTime.innerText = `${mins} 分钟`;
            }
        }

        function renderSelect(){
            const start = inputText.selectionStart;
            const end = inputText.selectionEnd;
            const selText = inputText.value.substring(start, end);
            const s = calcStats(selText);
            selAll.innerText = s.allLen;
            selNoSpace.innerText = s.noSpaceLen;
            selHan.innerText = s.hanCount;
            selWord.innerText = s.wordCount;
        }

        inputText.addEventListener('input', renderFull);
        inputText.addEventListener('select', renderSelect);
        inputText.addEventListener('keyup', renderSelect);
        inputText.addEventListener('mouseup', renderSelect);

        btnClear.onclick = () => {
            inputText.value = '';
            renderFull();
            renderSelect();
        };

        btnPaste.onclick = async () => {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    inputText.value += text;
                    renderFull();
                } else {
                    alert('请直接在文本框内使用键盘快捷键 Ctrl + V 粘贴');
                }
            } catch(e) {
                alert('剪贴板读取受限，请直接使用快捷键 Ctrl + V 粘贴');
            }
        };

        btnCopy.onclick = () => {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(inputText.value).then(() => {
                    alert('已成功复制全部文本内容！');
                }).catch(() => {
                    fallbackCopy();
                });
            } else {
                fallbackCopy();
            }
        };

        function fallbackCopy() {
            inputText.focus();
            inputText.select();
            try {
                document.execCommand('copy');
                alert('已成功复制全部文本内容！');
            } catch (err) {
                alert('复制失败，请手动全选复制');
            }
        }

        btnUppercase.onclick = () => {
            inputText.value = inputText.value.toUpperCase();
            renderFull();
        };

        btnLowercase.onclick = () => {
            inputText.value = inputText.value.toLowerCase();
            renderFull();
        };

        initTheme();
        renderFull();
        renderSelect();
    </script>
</body>
</html>
