<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown预览与PDF/HTML导出工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    colors: { primary: '#22c55e' },
                    fontFamily: { mono: ['Consolas','Monaco','Menlo','monospace'] }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient {
                background-clip: text;
                -webkit-background-clip: text;
                color: transparent;
                background-image: linear-gradient(90deg, #4ade80, #06b6d4);
            }
            .btn { @apply px-3 py-2 rounded-lg transition-all duration-200 text-sm flex items-center gap-1.5; }
            .btn-primary { @apply bg-primary text-white hover:bg-primary/80; }
            .btn-outline { @apply border border-[var(--border)] hover:bg-[var(--sub-bg)]; }
        }
        html[data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e293b;
            --sub-bg: #334155;
            --border: #475569;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
        }
        html[data-theme="light"] {
            --bg: #f8fafc;
            --card: #ffffff;
            --sub-bg: #e2e8f0;
            --border: #cbd5e1;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
        }
        .card { background-color: var(--card); border:1px solid var(--border); }
        .text-sub { color: var(--text-sub); }
        textarea {
            background-color: #020617;
            color:#e5e7eb;
            border:1px solid var(--border);
            font-family:Consolas,Monaco,monospace;
        }
        textarea:focus { outline:none; border-color:#22c55e; }

        /* Markdown预览样式 */
        .md-preview h1 { font-size: 1.8rem; font-weight: bold; margin: 0.8rem 0 0.4rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
        .md-preview h2 { font-size: 1.5rem; font-weight: bold; margin: 0.8rem 0 0.4rem; }
        .md-preview h3 { font-size: 1.25rem; font-weight: bold; margin: 0.6rem 0 0.3rem; }
        .md-preview p { margin: 0.4rem 0; line-height:1.7; }
        .md-preview pre { padding: 0.75rem; border-radius: 6px; overflow-x:auto; background:#020617; margin:0.5rem 0; border: 1px solid var(--border); }
        .md-preview code { font-family:Consolas,monospace; }
        .md-preview :not(pre)>code { background: rgba(34,197,94,0.15); padding: 2px 6px; border-radius:4px; color: #4ade80; }
        .md-preview blockquote { border-left:4px solid #22c55e; padding-left:0.8rem; opacity:0.9; margin:0.5rem 0; color: var(--text-sub); }
        .md-preview ul, .md-preview ol { padding-left:1.5rem; margin:0.4rem 0; }
        .md-preview li { margin:0.2rem 0; }
        .md-preview table { border-collapse: collapse; width:100%; margin:0.6rem 0; }
        .md-preview th, .md-preview td { border:1px solid var(--border); padding: 6px 10px; }
        .md-preview th { background-color: var(--sub-bg); }
        .md-preview hr { border-color: var(--border); margin:1rem 0; }
        .md-preview a { color:#38bdf8; text-decoration:underline; }
        .md-preview img { max-width:100%; border-radius:6px; }

        /* PDF 打印专属排版优化 */
        @media print {
            body { background: white !important; color: black !important; }
            header, .no-print { display: none !important; }
            .card { border: none !important; box-shadow: none !important; background: transparent !important; padding: 0 !important; }
            .md-preview { background: white !important; color: black !important; overflow: visible !important; height: auto !important; }
            .md-preview pre { background: #f1f5f9 !important; color: #0f172a !important; border: 1px solid #cbd5e1; }
            .md-preview :not(pre)>code { background: #f1f5f9 !important; color: #16a34a !important; }
        }
    </style>
</head>
<body class="p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
        <!-- 顶栏 -->
        <div class="flex items-center justify-between mb-6 no-print">
            <a href="/toolkit/index.html" class="btn btn-outline">
                <i class="fa-solid fa-arrow-left"></i> 返回首页
            </a>
            <h1 class="text-xl font-bold text-gradient"><i class="fa-brands fa-markdown mr-2"></i>Markdown 高级预览与导出中心</h1>
            <button id="themeToggle" class="btn btn-outline"><i class="fa-solid fa-moon"></i></button>
        </div>

        <!-- 功能全局操作工具栏 -->
        <div class="card p-3 rounded-xl mb-4 flex flex-wrap items-center justify-between gap-3 no-print">
            <div class="text-xs text-sub flex items-center gap-2">
                <span><i class="fa-solid fa-chart-simple text-green-400 mr-1"></i>字数: <strong id="wordCount" class="text-white">0</strong></span>
                <span>|</span>
                <span><i class="fa-solid fa-clock text-sky-400 mr-1"></i>实时自动保存已启用</span>
            </div>
            <div class="flex flex-wrap gap-2">
                <button id="sampleBtn" class="btn btn-outline"><i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>加载示例</button>
                <button id="clearBtn" class="btn btn-outline"><i class="fa-solid fa-trash text-red-400"></i>清空</button>
                <button id="exportHtmlBtn" class="btn btn-outline"><i class="fa-solid fa-code text-blue-400"></i>导出完整HTML</button>
                <button id="exportPdfBtn" class="btn btn-primary"><i class="fa-solid fa-file-pdf"></i>打印 / 保存 PDF</button>
            </div>
        </div>

        <!-- 主体左右分栏 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4" style="height: calc(100vh - 200px);">
            <!-- 左侧 MD输入 -->
            <div class="card p-4 rounded-xl flex flex-col h-full no-print">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-medium text-sm"><i class="fa-solid fa-file-pen mr-1 text-green-400"></i>Markdown 源码输入</span>
                </div>
                <textarea id="mdInput" class="w-full flex-1 p-3 rounded resize-none text-sm leading-relaxed" placeholder="在此输入或粘贴 Markdown 内容..."></textarea>
            </div>
            
            <!-- 右侧实时预览 -->
            <div class="card p-4 rounded-xl flex flex-col h-full overflow-hidden">
                <div class="flex justify-between items-center mb-2 no-print">
                    <span class="font-medium text-sm"><i class="fa-solid fa-eye mr-1 text-sky-400"></i>排版实时预览</span>
                    <button id="copyHtmlCodeBtn" class="btn btn-outline text-xs py-1"><i class="fa-solid fa-copy"></i>复制HTML源码</button>
                </div>
                <div id="previewBox" class="md-preview overflow-auto flex-1 p-4 rounded bg-[#020617] text-slate-100"></div>
            </div>
        </div>
    </div>

    <script>
        function initTheme(){
            const t = localStorage.getItem("toolTheme") || "dark";
            document.documentElement.setAttribute("data-theme", t);
            updateIcon(t);
        }
        function updateIcon(theme){
            const i = document.querySelector("#themeToggle i");
            i.className = theme === "dark" ? "fa-solid fa-moon" : "fa-solid fa-sun";
        }
        document.getElementById("themeToggle").onclick = ()=>{
            const curr = document.documentElement.getAttribute("data-theme");
            const next = curr === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("toolTheme", next);
            updateIcon(next);
        }
        initTheme();

        const mdInput = document.getElementById('mdInput');
        const previewBox = document.getElementById('previewBox');
        const clearBtn = document.getElementById('clearBtn');
        const sampleBtn = document.getElementById('sampleBtn');
        const exportHtmlBtn = document.getElementById('exportHtmlBtn');
        const exportPdfBtn = document.getElementById('exportPdfBtn');
        const copyHtmlCodeBtn = document.getElementById('copyHtmlCodeBtn');
        const wordCount = document.getElementById('wordCount');

        const sampleMd = `# Markdown 示例文档

欢迎使用 **Markdown 转 HTML / PDF 导出工具**！这是一个纯前端运行的极简实用工具。

## 核心特性
- **实时预览**：左侧输入，右侧即时高品质渲染。
- **一键导出 HTML**：生成带完整样式和自包含结构的网页文件。
- **一键打印 PDF**：调用系统级打印引擎输出排版精美的 PDF。

## 代码与表格示例
\`\`\`javascript
function greet(name) {
    console.log("Hello, " + name + "!");
}
greet("Developer");
\`\`\`

| 功能模块 | 状态 | 备注 |
| :--- | :---: | :--- |
| Markdown 解析 | ✅ 已完成 | 基于 Marked.js |
| PDF 导出 | ✅ 已完成 | 优化 Print CSS |

> “悟已往之不谏，知来者之可追。” —— 陶渊明

---
*祝您使用愉快！*`;

        // 页面加载时恢复本地缓存
        const savedMd = localStorage.getItem('tool_md_content');
        if(savedMd !== null){
            mdInput.value = savedMd;
        } else {
            mdInput.value = sampleMd;
        }

        function renderMd(){
            const raw = mdInput.value;
            // 实时存入缓存
            localStorage.setItem('tool_md_content', raw);
            
            // 更新字数统计
            wordCount.innerText = raw.length;

            // 渲染HTML
            const html = marked.parse(raw);
            previewBox.innerHTML = html;
        }

        mdInput.oninput = renderMd;

        sampleBtn.onclick = ()=>{
            mdInput.value = sampleMd;
            renderMd();
        };

        clearBtn.onclick = ()=>{
            if(confirm("确定要清空当前输入的内容吗？")) {
                mdInput.value = '';
                renderMd();
            }
        };

        // 复制 HTML 片段
        copyHtmlCodeBtn.onclick = async ()=>{
            try {
                await navigator.clipboard.writeText(previewBox.innerHTML);
                alert('✅ 渲染后的 HTML 代码已成功复制到剪贴板！');
            } catch(e) {
                alert('❌ 复制失败，请手动复制');
            }
        };

        // 核心功能：导出排版精美的独立 HTML 文件
        exportHtmlBtn.onclick = ()=>{
            const bodyHtml = previewBox.innerHTML;
            if(!bodyHtml.trim()){
                alert("当前没有可导出的 Markdown 内容！");
                return;
            }

            const fullHtml = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Exported Markdown Document</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #1e293b; line-height: 1.7; }
        h1 { font-size: 1.8rem; font-weight: bold; margin: 0.8rem 0 0.4rem; border-bottom: 1px solid #cbd5e1; padding-bottom: 0.3rem; }
        h2 { font-size: 1.5rem; font-weight: bold; margin: 0.8rem 0 0.4rem; }
        h3 { font-size: 1.25rem; font-weight: bold; margin: 0.6rem 0 0.3rem; }
        p { margin: 0.4rem 0; }
        pre { padding: 0.75rem; border-radius: 6px; overflow-x: auto; background: #0f172a; color: #38bdf8; margin: 0.5rem 0; }
        code { font-family: Consolas, monospace; }
        :not(pre)>code { background: rgba(34,197,94,0.15); padding: 2px 6px; border-radius: 4px; color: #16a34a; }
        blockquote { border-left: 4px solid #22c55e; padding-left: 0.8rem; margin: 0.5rem 0; color: #64748b; }
        ul, ol { padding-left: 1.5rem; margin: 0.4rem 0; }
        table { border-collapse: collapse; width: 100%; margin: 0.6rem 0; }
        th, td { border: 1px solid #cbd5e1; padding: 6px 10px; }
        th { background-color: #f1f5f9; }
        hr { border: 0; border-top: 1px solid #cbd5e1; margin: 1rem 0; }
        a { color: #0284c7; text-decoration: underline; }
        img { max-width: 100%; border-radius: 6px; }
    </style>
</head>
<body>
    ${bodyHtml}
</body>
</html>`;

            const blob = new Blob([fullHtml], {type: 'text/html;charset=utf-8'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `markdown-doc-${Date.now()}.html`;
            a.click();
            URL.revokeObjectURL(a.href);
        };

        // 核心功能：直接调用浏览器打印引擎一键保存/导出排版精美的 PDF
        exportPdfBtn.onclick = ()=>{
            const content = previewBox.innerHTML.trim();
            if(!content){
                alert("当前没有内容可供导出 PDF！");
                return;
            }
            window.print();
        };

        renderMd();
    </script>
</body>
</html>
