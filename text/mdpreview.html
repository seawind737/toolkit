<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown预览 | MD实时转HTML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    colors: { primary: '#22c55e' },
                    fontFamily: { mono: ['Consolas','Monaco','Menlo','monospace'] }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient {
                background-clip: text;
                -webkit-background-clip: text;
                color: transparent;
                background-image: linear-gradient(90deg, #4ade80, #06b6d4);
            }
            .btn { @apply px-3 py-2 rounded-lg transition-all duration-200 text-sm; }
            .btn-primary { @apply bg-primary text-white hover:bg-primary/80; }
            .btn-outline { @apply border border-[var(--border)] hover:bg-[var(--sub-bg)]; }
        }
        html[data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e293b;
            --sub-bg: #334155;
            --border: #475569;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
        }
        html[data-theme="light"] {
            --bg: #f8fafc;
            --card: #ffffff;
            --sub-bg: #e2e8f0;
            --border: #cbd5e1;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
        }
        .card { background-color: var(--card); border:1px solid var(--border); }
        .text-sub { color: var(--text-sub); }
        textarea {
            background-color: #020617;
            color:#e5e7eb;
            border:1px solid var(--border);
            font-family:Consolas,Monaco,monospace;
        }
        textarea:focus { outline:none; border-color:#22c55e; }

        /* Markdown预览样式 */
        .md-preview h1 { font-size: 1.8rem; font-weight: bold; margin: 0.8rem 0 0.4rem; }
        .md-preview h2 { font-size: 1.5rem; font-weight: bold; margin: 0.8rem 0 0.4rem; }
        .md-preview h3 { font-size: 1.25rem; font-weight: bold; margin: 0.6rem 0 0.3rem; }
        .md-preview p { margin: 0.4rem 0; line-height:1.7; }
        .md-preview pre { padding: 0.75rem; border-radius: 6px; overflow-x:auto; background:#020617; margin:0.5rem 0; }
        .md-preview code { font-family:Consolas,monospace; }
        .md-preview :not(pre)>code { background: rgba(34,197,94,0.15); padding: 2px 6px; border-radius:4px; }
        .md-preview blockquote { border-left:4px solid #22c55e; padding-left:0.8rem; opacity:0.9; margin:0.5rem 0; }
        .md-preview ul, .md-preview ol { padding-left:1.5rem; margin:0.4rem 0; }
        .md-preview li { margin:0.2rem 0; }
        .md-preview table { border-collapse: collapse; width:100%; margin:0.6rem 0; }
        .md-preview th, .md-preview td { border:1px solid var(--border); padding: 6px 10px; }
        .md-preview hr { border-color: var(--border); margin:1rem 0; }
        .md-preview a { color:#38bdf8; text-decoration:underline; }
        .md-preview img { max-width:100%; border-radius:6px; }
    </style>
</head>
<body class="p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <a href="/toolkit/index.html" class="btn btn-outline flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> 返回
            </a>
            <h1 class="text-xl font-bold text-gradient"><i class="fa-brands fa-markdown mr-2"></i>Markdown预览</h1>
            <button id="themeToggle" class="btn btn-outline"><i class="fa-solid fa-moon"></i></button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4" style="height: calc(100vh - 140px);">
            <!-- 左侧 MD输入 -->
            <div class="card p-4 rounded-xl flex flex-col h-full">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-medium"><i class="fa-solid fa-file-pen mr-1 text-green-400"></i>Markdown源码</span>
                    <div class="flex gap-2">
                        <button id="clearBtn" class="btn btn-outline">清空</button>
                        <button id="sampleBtn" class="btn btn-outline">加载示例</button>
                    </div>
                </div>
                <textarea id="mdInput" class="w-full flex-1 p-3 rounded resize-none" placeholder="在这里粘贴 Markdown..."></textarea>
            </div>
            <!-- 右侧预览 + HTML结果 -->
            <div class="flex flex-col gap-4 h-full">
                <div class="card p-4 rounded-xl flex flex-col flex-1 overflow-hidden">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-medium"><i class="fa-solid fa-eye mr-1 text-sky-400"></i>实时预览</span>
                    </div>
                    <div id="previewBox" class="md-preview overflow-auto flex-1 p-3 rounded bg-[#020617]"></div>
                </div>
                <div class="card p-4 rounded-xl flex flex-col h-48 overflow-hidden">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-medium"><i class="fa-solid fa-code mr-1 text-amber-400"></i>渲染后HTML</span>
                        <span>
                            <button id="copyHtmlBtn" class="btn btn-primary"><i class="fa-solid fa-copy mr-1"></i>复制HTML</button>
                            <button id="downHtmlBtn" class="btn btn-primary"><i class="fa-solid fa-download mr-1"></i>下载HTML</button>    
                        </span>
                    </div>
                    <textarea id="htmlOutput" class="w-full flex-1 p-3 rounded resize-none bg-[#020617] text-[#e5e7eb]"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        function initTheme(){
            const t = localStorage.getItem("toolTheme") || "dark";
            document.documentElement.setAttribute("data-theme", t);
            updateIcon(t);
        }
        function updateIcon(theme){
            const i = document.querySelector("#themeToggle i");
            i.className = theme === "dark" ? "fa-solid fa-moon" : "fa-solid fa-sun";
        }
        document.getElementById("themeToggle").onclick = ()=>{
            const curr = document.documentElement.getAttribute("data-theme");
            const next = curr === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("toolTheme", next);
            updateIcon(next);
        }
        initTheme();

        const mdInput = document.getElementById('mdInput');
        const previewBox = document.getElementById('previewBox');
        const htmlOutput = document.getElementById('htmlOutput');
        const clearBtn = document.getElementById('clearBtn');
        const sampleBtn = document.getElementById('sampleBtn');
        const copyHtmlBtn = document.getElementById('copyHtmlBtn');
        const downHtmlBtn = document.getElementById('downHtmlBtn');

        const sampleMd = `# Markdown 示例标题
## 二级标题
普通文本，**加粗**、*斜体*、\`行内代码\`

> 这是引用块内容

- 列表项A
- 列表项B
- 列表项C

\`\`\`js
function test(){
    console.log("hello md preview");
}
\`\`\`

| 姓名 | 年龄 |
| ---- | ---- |
| 张三 | 24 |
| 李四 | 30 |

[跳转链接](https://github.com)

---
段落分隔线`;

        function renderMd(){
            const raw = mdInput.value;
            const html = marked.parse(raw);
            previewBox.innerHTML = html;
            htmlOutput.value = html;
        }

        mdInput.oninput = renderMd;
        sampleBtn.onclick = ()=>{
            mdInput.value = sampleMd;
            renderMd();
        };
        clearBtn.onclick = ()=>{
            mdInput.value = '';
            renderMd();
        };
        copyHtmlBtn.onclick = async ()=>{
            try {
                await navigator.clipboard.writeText(htmlOutput.value);
                alert('✅ HTML已复制');
            } catch(e) {
                // 复制失败时自动选中文本，用户手动Ctrl+C
                htmlOutput.focus();
                htmlOutput.select();
                alert('❌ 剪贴板复制失败，已自动选中HTML，请 Ctrl+C 手动复制');
            }
        };
        downHtmlBtn.onclick = ()=>{
            const html = htmlOutput.value;
            if(!html){
                alert("暂无HTML内容");
                return;
            }
            const blob = new Blob([html], {type: 'text/html;charset=utf-8'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'md-preview.html';
            a.click();
            URL.revokeObjectURL(a.href);
        };

        renderMd();
    </script>
</body>
</html>
